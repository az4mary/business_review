name: Capture ZYNE Property Full Page

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Live property page URL to capture"
        required: false
        default: "https://zyne.store/homedetail/7101-wendemere-st-houston-tx-77088/"
      wait_seconds:
        description: "Maximum seconds to wait for the live page to become current"
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  capture:
    name: Capture current live property page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright

      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: Capture current page screenshots
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          WAIT_SECONDS: ${{ github.event.inputs.wait_seconds }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import { mkdirSync, writeFileSync } from "node:fs";
          import path from "node:path";

          const targetUrl = process.env.TARGET_URL || "https://zyne.store/homedetail/7101-wendemere-st-houston-tx-77088/";
          const waitSeconds = Number(process.env.WAIT_SECONDS || 300);
          const runId = process.env.RUN_ID || String(Date.now());
          const runAttempt = process.env.RUN_ATTEMPT || "1";
          const commitSha = process.env.COMMIT_SHA || "";

          const outputDir = "property-page-captures";
          mkdirSync(outputDir, { recursive: true });

          const cacheBust = `capture=${encodeURIComponent(runId)}-${encodeURIComponent(runAttempt)}-${Date.now()}`;

          function withCacheBust(url) {
            const parsed = new URL(url);
            parsed.searchParams.set("_zyne_capture", cacheBust);
            return parsed.toString();
          }

          const freshUrl = withCacheBust(targetUrl);

          const requiredMarkers = [
            "7101 Wendemere St",
            "Houston, TX 77088",
            "$1,495/month",
            "For Rent · Active",
            "Schedule a Viewing",
            "Request to Apply",
            "Listing Agent",
            "Carissa Weber",
            "PLATINUM",
            "Better Homes and Gardens Real Estate",
            "Gary Greene - Sugar Land",
            "https://www.har.com/carissa-weber/agent_WEBERC",
            "/assets/agents/carissa-weber.png",
            "/assets/decor/zyne-gold-pillars.png",
            "See all 18 photos",
            "max-width: 1440px",
            "grid-template-columns: minmax(0, 1.48fr) minmax(460px, .98fr)",
            "width: 88px",
            "Wendemere St"
          ];

          const viewports = [
            {
              name: "desktop-1920",
              width: 1920,
              height: 1080,
              deviceScaleFactor: 1
            },
            {
              name: "desktop-1440",
              width: 1440,
              height: 900,
              deviceScaleFactor: 1
            },
            {
              name: "tablet-768",
              width: 768,
              height: 1024,
              deviceScaleFactor: 1
            },
            {
              name: "mobile-390",
              width: 390,
              height: 844,
              deviceScaleFactor: 2
            }
          ];

          async function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          async function stabilizePage(page) {
            await page.waitForLoadState("domcontentloaded");
            await page.waitForLoadState("load");
            await page.waitForLoadState("networkidle").catch(() => {});

            await page.evaluate(async () => {
              if (document.fonts && document.fonts.ready) {
                await document.fonts.ready.catch(() => {});
              }

              const images = Array.from(document.images);
              await Promise.all(
                images.map((img) => {
                  if (img.complete) return Promise.resolve();
                  return new Promise((resolve) => {
                    img.addEventListener("load", resolve, { once: true });
                    img.addEventListener("error", resolve, { once: true });
                  });
                })
              );
            });

            await page.evaluate(async () => {
              await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            });
          }

          async function getCurrentHtml(page) {
            const response = await page.goto(freshUrl, {
              waitUntil: "networkidle",
              timeout: 60000
            });

            await stabilizePage(page);

            const html = await page.content();
            const status = response ? response.status() : null;
            const finalUrl = page.url();

            return { html, status, finalUrl, response };
          }

          async function waitForCurrentPage(page) {
            const deadline = Date.now() + waitSeconds * 1000;
            let attempt = 0;
            let lastResult = null;

            while (Date.now() < deadline) {
              attempt += 1;

              const result = await getCurrentHtml(page);
              lastResult = result;

              const missing = requiredMarkers.filter((marker) => !result.html.includes(marker));

              console.log(`Attempt ${attempt}: status=${result.status}, finalUrl=${result.finalUrl}`);
              console.log(`Document length: ${result.html.length}`);
              console.log(`Missing markers: ${missing.length ? missing.join(" | ") : "none"}`);

              if (!missing.length) {
                return {
                  ...result,
                  attempt,
                  missing: []
                };
              }

              await sleep(15000);
            }

            const missing = requiredMarkers.filter((marker) => !lastResult?.html?.includes(marker));

            writeFileSync(
              path.join(outputDir, "stale-page-debug.html"),
              lastResult?.html || "",
              "utf8"
            );

            throw new Error(
              [
                "Live page did not become current before timeout.",
                `Target URL: ${targetUrl}`,
                `Fresh URL: ${freshUrl}`,
                `Wait seconds: ${waitSeconds}`,
                `Missing markers: ${missing.join(", ")}`,
                `Debug HTML saved to ${outputDir}/stale-page-debug.html`
              ].join("\n")
            );
          }

          async function autoScroll(page) {
            await page.evaluate(async () => {
              await new Promise((resolve) => {
                let totalHeight = 0;
                const distance = 600;
                const timer = setInterval(() => {
                  const scrollHeight = document.body.scrollHeight;
                  window.scrollBy(0, distance);
                  totalHeight += distance;

                  if (totalHeight >= scrollHeight - window.innerHeight) {
                    clearInterval(timer);
                    resolve();
                  }
                }, 120);
              });

              window.scrollTo(0, 0);
            });

            await page.waitForTimeout(500);
          }

          const browser = await chromium.launch({
            headless: true
          });

          const context = await browser.newContext({
            ignoreHTTPSErrors: true,
            bypassCSP: true,
            extraHTTPHeaders: {
              "Cache-Control": "no-cache, no-store, must-revalidate",
              "Pragma": "no-cache",
              "Expires": "0"
            }
          });

          await context.route("**/*", async (route) => {
            const request = route.request();
            const headers = {
              ...request.headers(),
              "Cache-Control": "no-cache, no-store, must-revalidate",
              "Pragma": "no-cache",
              "Expires": "0"
            };

            await route.continue({ headers });
          });

          const page = await context.newPage();

          const current = await waitForCurrentPage(page);

          const manifest = {
            capturedAt: new Date().toISOString(),
            runId,
            runAttempt,
            commitSha,
            targetUrl,
            freshUrl,
            finalUrl: current.finalUrl,
            httpStatus: current.status,
            attemptsUntilCurrent: current.attempt,
            requiredMarkers,
            missingMarkers: current.missing,
            title: await page.title(),
            documentLength: current.html.length,
            imageCount: await page.evaluate(() => document.images.length),
            completeImageCount: await page.evaluate(() => Array.from(document.images).filter((img) => img.complete).length),
            screenshots: []
          };

          writeFileSync(
            path.join(outputDir, "verified-current-page.html"),
            current.html,
            "utf8"
          );

          for (const viewport of viewports) {
            await page.setViewportSize({
              width: viewport.width,
              height: viewport.height
            });

            await page.goto(freshUrl, {
              waitUntil: "networkidle",
              timeout: 60000
            });

            await stabilizePage(page);
            await autoScroll(page);
            await stabilizePage(page);

            const screenshotPath = path.join(outputDir, `${viewport.name}.png`);

            await page.screenshot({
              path: screenshotPath,
              fullPage: true,
              animations: "disabled"
            });

            manifest.screenshots.push({
              name: viewport.name,
              width: viewport.width,
              height: viewport.height,
              path: screenshotPath
            });

            console.log(`Captured ${screenshotPath}`);
          }

          writeFileSync(
            path.join(outputDir, "capture-manifest.json"),
            JSON.stringify(manifest, null, 2),
            "utf8"
          );

          await browser.close();

          console.log("Capture completed successfully.");
          NODE

      - name: Upload screenshots and capture evidence
        uses: actions/upload-artifact@v4
        with:
          name: zyne-property-current-page-captures
          path: property-page-captures/
          if-no-files-found: error
