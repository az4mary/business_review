name: Capture ZYNE Propertypage Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Capture responsive homepage screenshots
        run: |
          mkdir -p assets/PRD-1.1-images
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const url = 'https://zyne.store/homedetail/7101-wendemere-st-houston-tx-77088/';
          const outputDir = 'assets/PRD-1.1-images';

          const captures = [
            {
              name: 'Desktop High-Res',
              file: 'Desktop-HighRes.png',
              viewport: { width: 1920, height: 1080 },
              deviceScaleFactor: 2,
              fullPage: true,
            },
            {
              name: 'Tablet',
              file: 'Tablet.png',
              viewport: { width: 768, height: 1024 },
              fullPage: true,
            },
            {
              name: 'Mobile',
              file: 'Mobile.png',
              viewport: { width: 390, height: 844 },
              fullPage: true,
            },
            {
              name: 'Mobile Menu',
              file: 'Mobile-Menu.png',
              viewport: { width: 390, height: 844 },
              fullPage: false,
              openMobileMenu: true,
            },
          ];

          async function autoScroll(page) {
            await page.evaluate(async () => {
              document.documentElement.style.scrollBehavior = 'auto';
              document.body.style.scrollBehavior = 'auto';

              await new Promise((resolve) => {
                let lastScrollY = -1;
                const distance = 700;
                const timer = setInterval(() => {
                  const maxScrollY = document.documentElement.scrollHeight - window.innerHeight;
                  window.scrollBy(0, distance);

                  if (window.scrollY === lastScrollY || window.scrollY >= maxScrollY) {
                    clearInterval(timer);
                    resolve();
                    return;
                  }

                  lastScrollY = window.scrollY;
                }, 150);
              });
            });

            await page.waitForTimeout(1200);
          }

          async function prepareForScreenshot(page) {
            await page.addStyleTag({
              content: `
                html, body { scroll-behavior: auto !important; }
                .skip-link { display: none !important; }
              `
            });

            await page.evaluate(() => {
              document.documentElement.style.scrollBehavior = 'auto';
              document.body.style.scrollBehavior = 'auto';
              document.body.classList.remove('show-mobile-sticky-cta');
              if (document.activeElement instanceof HTMLElement) {
                document.activeElement.blur();
              }
              window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
            });

            await page.waitForFunction(() => window.scrollY === 0 && window.scrollX === 0, null, { timeout: 10000 });
            await page.waitForTimeout(500);
          }

          async function captureViewport(browser, capture) {
            const outputPath = path.join(outputDir, capture.file);
            const context = await browser.newContext({
              viewport: capture.viewport,
              deviceScaleFactor: 1,
              isMobile: capture.viewport.width <= 430,
              hasTouch: capture.viewport.width <= 430,
            });
            const page = await context.newPage();
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});

            if (capture.fullPage) {
              await autoScroll(page);
            }

            await prepareForScreenshot(page);

            if (capture.openMobileMenu) {
              await page.locator('.menu-toggle').click({ timeout: 10000 });
              await page.waitForTimeout(500);
            }

            await page.screenshot({ path: outputPath, fullPage: capture.fullPage });
            const title = await page.title();
            const size = await page.evaluate(() => ({
              width: document.documentElement.scrollWidth,
              height: document.documentElement.scrollHeight,
              scrollY: window.scrollY,
            }));

            console.log(`Captured ${capture.name}: ${outputPath}`);
            console.log(`URL: ${url}`);
            console.log(`HTTP status: ${response ? response.status() : 'unknown'}`);
            console.log(`Title: ${title}`);
            console.log(`Viewport: ${capture.viewport.width}x${capture.viewport.height}`);
            console.log(`Document size: ${size.width}x${size.height}`);
            console.log(`Scroll position before screenshot: ${size.scrollY}`);

            await context.close();
          }

          (async () => {
            fs.mkdirSync(outputDir, { recursive: true });
            const browser = await chromium.launch();
            for (const capture of captures) {
              await captureViewport(browser, capture);
            }
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit screenshots to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/PRD-1.1-images/Desktop-HighRes.png \
            assets/PRD-1.1-images/Tablet.png \
            assets/PRD-1.1-images/Mobile.png \
            assets/PRD-1.1-images/Mobile-Menu.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Capture responsive homepage screenshots"
            git push
          fi

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyne-responsive-propertypage-screenshots
          path: |
            assets/PRD-1.1-images/Desktop-HighRes.png
            assets/PRD-1.1-images/Tablet.png
            assets/PRD-1.1-images/Mobile.png
            assets/PRD-1.1-images/Mobile-Menu.png
          if-no-files-found: error

