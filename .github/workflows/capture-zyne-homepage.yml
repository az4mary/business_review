name: Capture ZYNE Homepage Screenshot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/capture-zyne-homepage.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Capture full-page screenshot
        run: |
          mkdir -p zyne-screenshots
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const url = 'https://zyne.store/';
          const outputDir = 'zyne-screenshots';
          const outputPath = path.join(outputDir, 'zyne-homepage-fullpage-desktop.png');

          async function autoScroll(page) {
            await page.evaluate(async () => {
              await new Promise((resolve) => {
                let totalHeight = 0;
                const distance = 700;
                const timer = setInterval(() => {
                  const scrollHeight = document.body.scrollHeight;
                  window.scrollBy(0, distance);
                  totalHeight += distance;
                  if (totalHeight >= scrollHeight) {
                    clearInterval(timer);
                    resolve();
                  }
                }, 150);
              });
            });
            await page.waitForTimeout(1200);
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(600);
          }

          (async () => {
            fs.mkdirSync(outputDir, { recursive: true });
            const browser = await chromium.launch();
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1200 },
              deviceScaleFactor: 1,
            });
            const page = await context.newPage();
            await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
            await autoScroll(page);
            await page.screenshot({ path: outputPath, fullPage: true });
            const title = await page.title();
            const size = await page.evaluate(() => ({
              width: document.documentElement.scrollWidth,
              height: document.documentElement.scrollHeight,
            }));
            console.log(`Captured ${outputPath}`);
            console.log(`Title: ${title}`);
            console.log(`Document size: ${size.width}x${size.height}`);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyne-homepage-screenshot
          path: zyne-screenshots/
          if-no-files-found: error
