name: Capture ZYNE Homepage Screenshot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/capture-zyne-homepage.yml"
      - "projects/zyne-homepage/src/main.js"
      - "projects/zyne-homepage/src/styles/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Capture full-page desktop screenshot
        run: |
          mkdir -p assets/PRD-1.1-images
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const url = 'https://zyne.store/';
          const outputDir = 'assets/PRD-1.1-images';
          const outputPath = path.join(outputDir, 'Desktop.png');

          async function autoScroll(page) {
            await page.evaluate(async () => {
              document.documentElement.style.scrollBehavior = 'auto';
              document.body.style.scrollBehavior = 'auto';

              await new Promise((resolve) => {
                let lastScrollY = -1;
                const distance = 700;
                const timer = setInterval(() => {
                  const maxScrollY = document.documentElement.scrollHeight - window.innerHeight;
                  window.scrollBy(0, distance);

                  if (window.scrollY === lastScrollY || window.scrollY >= maxScrollY) {
                    clearInterval(timer);
                    resolve();
                    return;
                  }

                  lastScrollY = window.scrollY;
                }, 150);
              });
            });

            await page.waitForTimeout(1200);
          }

          async function prepareForScreenshot(page) {
            await page.addStyleTag({
              content: `
                html, body { scroll-behavior: auto !important; }
                .skip-link { display: none !important; }
              `
            });

            await page.evaluate(() => {
              document.documentElement.style.scrollBehavior = 'auto';
              document.body.style.scrollBehavior = 'auto';
              if (document.activeElement instanceof HTMLElement) {
                document.activeElement.blur();
              }
              window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
            });

            await page.waitForFunction(() => window.scrollY === 0 && window.scrollX === 0, null, { timeout: 10000 });
            await page.waitForTimeout(500);
          }

          (async () => {
            fs.mkdirSync(outputDir, { recursive: true });
            const browser = await chromium.launch();
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1200 },
              deviceScaleFactor: 1,
            });
            const page = await context.newPage();
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
            await autoScroll(page);
            await prepareForScreenshot(page);
            await page.screenshot({ path: outputPath, fullPage: true });
            const title = await page.title();
            const size = await page.evaluate(() => ({
              width: document.documentElement.scrollWidth,
              height: document.documentElement.scrollHeight,
              scrollY: window.scrollY,
            }));
            console.log(`Captured ${outputPath}`);
            console.log(`URL: ${url}`);
            console.log(`HTTP status: ${response ? response.status() : 'unknown'}`);
            console.log(`Title: ${title}`);
            console.log(`Document size: ${size.width}x${size.height}`);
            console.log(`Scroll position before screenshot: ${size.scrollY}`);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit screenshot to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/PRD-1.1-images/Desktop.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Capture desktop homepage screenshot"
            git push
          fi

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyne-desktop-homepage-screenshot
          path: assets/PRD-1.1-images/Desktop.png
          if-no-files-found: error

