name: Capture PRD 1.2A Homepage Screenshots

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/capture-zyne-homepage.yml"
      - "projects/zyne-homepage/src/main.js"
      - "projects/zyne-homepage/src/render.js"
      - "projects/zyne-homepage/src/data/**"
      - "projects/zyne-homepage/src/styles/**"
  workflow_dispatch:

concurrency:
  group: capture-prd-1-2a-homepage-screenshots-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Capture PRD 1.2A responsive homepage screenshots
        run: |
          mkdir -p assets/PRD-1.2A-images
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const url = 'https://zyne.store/';
          const outputDir = 'assets/PRD-1.2A-images';

          const captures = [
            { name: 'Desktop', file: 'Desktop.png', viewport: { width: 1440, height: 1200 }, fullPage: true },
            { name: 'Tablet', file: 'Tablet.png', viewport: { width: 768, height: 1024 }, fullPage: true },
            { name: 'Mobile', file: 'Mobile.png', viewport: { width: 390, height: 844 }, fullPage: true },
            { name: 'Mobile Menu', file: 'Mobile-Menu.png', viewport: { width: 390, height: 844 }, fullPage: false, openMobileMenu: true },
            { name: 'Mobile Sticky CTA', file: 'Mobile-Sticky-CTA.png', viewport: { width: 390, height: 844 }, fullPage: false, showMobileStickyCta: true },
            { name: 'Mobile Diagnostic Result', file: 'Mobile-Diagnostic-Result.png', viewport: { width: 390, height: 844 }, fullPage: false, diagnosticRoute: 'website-conversion' },
          ];

          async function autoScroll(page) {
            await page.evaluate(async () => {
              document.documentElement.style.scrollBehavior = 'auto';
              document.body.style.scrollBehavior = 'auto';

              await new Promise((resolve) => {
                let lastScrollY = -1;
                const distance = 700;
                const timer = setInterval(() => {
                  const maxScrollY = document.documentElement.scrollHeight - window.innerHeight;
                  window.scrollBy(0, distance);

                  if (window.scrollY === lastScrollY || window.scrollY >= maxScrollY) {
                    clearInterval(timer);
                    resolve();
                    return;
                  }

                  lastScrollY = window.scrollY;
                }, 150);
              });
            });

            await page.waitForTimeout(1200);
          }

          async function prepareForScreenshot(page) {
            await page.addStyleTag({
              content: `
                html, body { scroll-behavior: auto !important; }
                .skip-link { display: none !important; }
              `
            });

            await page.evaluate(() => {
              document.documentElement.style.scrollBehavior = 'auto';
              document.body.style.scrollBehavior = 'auto';
              document.body.classList.remove('show-mobile-sticky-cta');
              if (document.activeElement instanceof HTMLElement) {
                document.activeElement.blur();
              }
              window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
            });

            await page.waitForFunction(() => window.scrollY === 0 && window.scrollX === 0, null, { timeout: 10000 });
            await page.waitForTimeout(500);
          }

          async function captureViewport(browser, capture) {
            const outputPath = path.join(outputDir, capture.file);
            const context = await browser.newContext({
              viewport: capture.viewport,
              deviceScaleFactor: 1,
              isMobile: capture.viewport.width <= 430,
              hasTouch: capture.viewport.width <= 430,
            });
            const page = await context.newPage();
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});

            if (capture.fullPage) await autoScroll(page);

            await prepareForScreenshot(page);

            if (capture.openMobileMenu) {
              await page.locator('.menu-toggle').click({ timeout: 10000 });
              await page.waitForTimeout(500);
            }

            if (capture.showMobileStickyCta) {
              await page.evaluate(() => {
                const target = document.querySelector('#services') || document.querySelector('#growth-paths');
                window.scrollTo(0, target ? target.getBoundingClientRect().top + window.scrollY : 900);
                document.body.classList.add('show-mobile-sticky-cta');
              });
              await page.waitForTimeout(500);
            }

            if (capture.diagnosticRoute) {
              await page.selectOption('#diagnostic-select', capture.diagnosticRoute);
              await page.locator('.diagnostic-submit').click({ timeout: 10000 });
              await page.waitForTimeout(500);
            }

            await page.screenshot({ path: outputPath, fullPage: capture.fullPage });
            const title = await page.title();
            const size = await page.evaluate(() => ({
              width: document.documentElement.scrollWidth,
              height: document.documentElement.scrollHeight,
              scrollY: window.scrollY,
            }));

            console.log(`Captured ${capture.name}: ${outputPath}`);
            console.log(`URL: ${url}`);
            console.log(`HTTP status: ${response ? response.status() : 'unknown'}`);
            console.log(`Title: ${title}`);
            console.log(`Viewport: ${capture.viewport.width}x${capture.viewport.height}`);
            console.log(`Document size: ${size.width}x${size.height}`);
            console.log(`Scroll position before screenshot: ${size.scrollY}`);

            await context.close();
          }

          (async () => {
            fs.mkdirSync(outputDir, { recursive: true });
            const browser = await chromium.launch();
            for (const capture of captures) await captureViewport(browser, capture);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit PRD 1.2A screenshots to repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/PRD-1.2A-images/Desktop.png \
            assets/PRD-1.2A-images/Tablet.png \
            assets/PRD-1.2A-images/Mobile.png \
            assets/PRD-1.2A-images/Mobile-Menu.png \
            assets/PRD-1.2A-images/Mobile-Sticky-CTA.png \
            assets/PRD-1.2A-images/Mobile-Diagnostic-Result.png
          if git diff --cached --quiet; then
            echo "No PRD 1.2A screenshot changes to commit."
            exit 0
          fi
          git commit -m "Capture PRD 1.2A responsive homepage screenshots"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying after refetch."
            sleep 5
          done
          echo "Unable to push PRD 1.2A screenshot commit after 3 attempts."
          exit 1

      - name: Upload PRD 1.2A screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: prd-1-2a-responsive-homepage-screenshots
          path: |
            assets/PRD-1.2A-images/Desktop.png
            assets/PRD-1.2A-images/Tablet.png
            assets/PRD-1.2A-images/Mobile.png
            assets/PRD-1.2A-images/Mobile-Menu.png
            assets/PRD-1.2A-images/Mobile-Sticky-CTA.png
            assets/PRD-1.2A-images/Mobile-Diagnostic-Result.png
          if-no-files-found: error
