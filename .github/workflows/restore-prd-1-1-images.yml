name: Restore PRD 1.1 Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/restore-prd-1-1-images.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Restore PRD 1.1 image folder from known-good snapshot
        run: |
          set -euo pipefail
          RESTORE_REF="a5f77f8309929cfd383520232c680fb0e317fa04"
          TARGET_DIR="assets/PRD-1.1-images"
          git fetch origin main
          git rm -r --ignore-unmatch "$TARGET_DIR"
          git checkout "$RESTORE_REF" -- "$TARGET_DIR"
          git status --short "$TARGET_DIR"

      - name: Commit restored PRD 1.1 images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/PRD-1.1-images
          if git diff --cached --quiet; then
            echo "PRD 1.1 images already match the restore snapshot."
            exit 0
          fi
          git commit -m "Restore original PRD 1.1 images"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying."
            sleep 5
          done
          exit 1
