name: Publish ZYNE Homepage

on:
  push:
    branches: [main]
    paths:
      # 1. EXPLICIT SOURCE & BUILD DIRECTORIES
      - "projects/zyne-homepage/src/**"
      - "projects/zyne-homepage/scripts/**"
      - "projects/zyne-homepage/public/**"
      # 2. CORE MANIFESTS & ROOT HTML
      - "projects/zyne-homepage/index.html"
      - "projects/zyne-homepage/package.json"
      - "package-lock.json"
      # 3. SHARED REPO ASSETS & GENERATED OUTPUTS
      - "assets/catalog/**"
      - "homedetail/**"
      - "services/**"
      - "grow-my-visibility/**"
      - "build-my-brand/**"
      - "improve-my-business/**"
      - "use-ai/**"
      - "convert-more-clients/**"
      - "intelligence/**"
      - "delivery/**"
      - "privacy/**"
      - "terms/**"
      - "refund-policy/**"
      - "cookie-policy/**"
      - "404.html"
      - ".github/workflows/zyne-homepage-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zyne-homepage-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/zyne-homepage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm install
      - run: npm run build
      - name: Verify PRD 1.1 publish artifact
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const html = readFileSync('dist/index.html', 'utf8');
          const required = [
            'mobile-sticky-cta',
            'hero_find_growth_path_click',
            'Best local visibility starter',
            'Search / map discovery signal',
            'Intelligence tells you what to build',
            'CollectionPage'
          ];
          const missing = required.filter((marker) => !html.includes(marker));
          const findGrowthPath = html.indexOf('hero_find_growth_path_click');
          const shopServices = html.indexOf('hero_shop_services_click');
          if (missing.length || findGrowthPath === -1 || shopServices === -1 || findGrowthPath > shopServices) {
            console.error('PRD 1.1 publish artifact verification failed.');
            if (missing.length) console.error(`Missing markers: ${missing.join(', ')}`);
            console.error(`hero_find_growth_path_click index: ${findGrowthPath}`);
            console.error(`hero_shop_services_click index: ${shopServices}`);
            process.exit(1);
          }
          console.log('PRD 1.1 publish artifact verification passed.');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: projects/zyne-homepage/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
