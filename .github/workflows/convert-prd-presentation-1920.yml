name: Convert PRD Presentation 1920x1080

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/convert-prd-presentation-1920.yml"
      - "assets/zyne-website-PRD-1.1-presentation.pdf"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Render PDF pages at 1920x1080
        run: |
          PDF="assets/zyne-website-PRD-1.1-presentation.pdf"
          OUT="assets/PRD-1.1-images/presentation-1920x1080"
          mkdir -p "$OUT/pages"
          pdfinfo "$PDF" > "$OUT/pdfinfo.txt"
          pdftoppm -png -scale-to-x 1920 -scale-to-y 1080 "$PDF" "$OUT/pages/page"
          printf "source_pdf=%s\ntarget_width=1920\ntarget_height=1080\n" "$PDF" > "$OUT/manifest.txt"
          find "$OUT/pages" -name "*.png" | sort >> "$OUT/manifest.txt"

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/PRD-1.1-images/presentation-1920x1080
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Create 1920x1080 presentation QA images"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: presentation-1920x1080
          path: assets/PRD-1.1-images/presentation-1920x1080
