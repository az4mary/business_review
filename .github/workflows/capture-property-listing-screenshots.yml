name: Capture Property Listing Screenshots

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/capture-property-listing-screenshots.yml"
      - "assets/chat/website-image-capture.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: property-listing-screenshots
  cancel-in-progress: false

jobs:
  capture:
    name: Capture HAR and Zillow responsive screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Capture property listing screenshots
        run: |
          rm -rf assets/property-listing-screenshots
          mkdir -p assets/property-listing-screenshots
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          const outputDir = 'assets/property-listing-screenshots';
          const issues = [];
          const failures = [];
          const manifest = {
            generatedAt: new Date().toISOString(),
            outputDir,
            note: 'High-resolution responsive first-page/full-page captures for HAR and Zillow listing pages. Persistent popups, app banners, login walls, or verification states are recorded while screenshots are still captured whenever rendering is possible.',
            captures: [],
          };

          const pages = [
            {
              name: 'HAR',
              slug: '01-har',
              url: 'https://www.har.com/homedetail/7101-wendemere-st-houston-tx-77088/11143299',
              locale: 'en-US',
              acceptLanguage: 'en-US,en;q=0.9',
              timezoneId: 'America/Chicago',
              geolocation: { latitude: 29.7604, longitude: -95.3698 },
            },
            {
              name: 'Zillow',
              slug: '02-zillow',
              url: 'https://www.zillow.com/homedetails/7101-Wendemere-St-Houston-TX-77088/27755092_zpid/',
              locale: 'en-US',
              acceptLanguage: 'en-US,en;q=0.9',
              timezoneId: 'America/Chicago',
              geolocation: { latitude: 29.7604, longitude: -95.3698 },
            },
          ];

          const devices = [
            {
              name: 'Desktop',
              fileSuffix: 'desktop',
              viewport: { width: 1920, height: 1080 },
              deviceScaleFactor: 2,
              isMobile: false,
              hasTouch: false,
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
            },
            {
              name: 'Tablet',
              fileSuffix: 'tablet',
              viewport: { width: 1024, height: 1366 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
              userAgent: 'Mozilla/5.0 (iPad; CPU OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1',
            },
            {
              name: 'Mobile',
              fileSuffix: 'mobile',
              viewport: { width: 430, height: 932 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1',
            },
          ];

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          function issueRecord(pageTarget, device, type, message, extra = {}) {
            return {
              site: pageTarget.name,
              requestedUrl: pageTarget.url,
              device: device ? device.name : null,
              type,
              message,
              ...extra,
            };
          }

          async function clickFirstVisible(page, locator, label) {
            const count = await locator.count().catch(() => 0);
            for (let index = 0; index < Math.min(count, 12); index += 1) {
              const candidate = locator.nth(index);
              if (!(await candidate.isVisible().catch(() => false))) continue;
              await candidate.click({ timeout: 2500 }).catch(() => null);
              await sleep(400);
              console.log(`Dismissed overlay/control: ${label}`);
              return true;
            }
            return false;
          }

          async function closeVisibleOverlay(page, label) {
            const closeSelectors = [
              'button[aria-label="Close"]',
              'button[aria-label*="close" i]',
              'button[aria-label*="dismiss" i]',
              '[role="button"][aria-label*="close" i]',
              '[role="button"][aria-label*="dismiss" i]',
              '[data-testid*="close" i]',
              '[data-test*="close" i]',
              '[class*="close" i]',
              '[class*="modal-close" i]',
              '[class*="dialog-close" i]',
              'button:has-text("×")',
              'button:has-text("✕")',
              '[role="button"]:has-text("×")',
              '[role="button"]:has-text("✕")',
              'button:has-text("X")',
            ];

            for (const selector of closeSelectors) {
              if (await clickFirstVisible(page, page.locator(selector), `${label}: ${selector}`)) return true;
            }

            const clickedByDom = await page.evaluate(() => {
              const elements = Array.from(document.querySelectorAll('button, [role="button"], [aria-label], [data-testid], [data-test], [class]'));
              const visible = (element) => {
                const rect = element.getBoundingClientRect();
                return rect.width > 0 && rect.height > 0 && rect.bottom >= 0 && rect.right >= 0 && rect.top <= window.innerHeight && rect.left <= window.innerWidth;
              };
              const candidate = elements.find((element) => {
                const label = [
                  element.getAttribute('aria-label'),
                  element.getAttribute('data-testid'),
                  element.getAttribute('data-test'),
                  element.getAttribute('class'),
                  element.textContent,
                ].filter(Boolean).join(' ').trim();
                const text = (element.textContent || '').trim();
                return visible(element) && (/close|dismiss/i.test(label) || /^[×x✕]$/i.test(text));
              });
              if (!candidate) return false;
              candidate.click();
              return true;
            }).catch(() => false);

            if (clickedByDom) {
              console.log(`Dismissed overlay/control via DOM fallback: ${label}`);
              await sleep(500);
              return true;
            }

            await page.keyboard.press('Escape').catch(() => {});
            await sleep(500);
            return false;
          }

          async function dismissPopups(page, pageTarget, device) {
            const buttonTexts = [
              'Accept all',
              'Accept All',
              'Accept Cookies',
              'Allow all',
              'I agree',
              'Agree',
              'OK',
              'Okay',
              'Got it',
              'Continue',
              'No thanks',
              'Not now',
              'Skip',
              'Close',
              'Maybe later',
              'Save',
            ];

            const textTriggers = [
              /sign\s+in/i,
              /log\s*in/i,
              /continue\s+with/i,
              /download\s+the\s+app/i,
              /open\s+in\s+app/i,
              /captcha/i,
              /verify/i,
              /are\s+you\s+a\s+human/i,
              /not\s+a\s+robot/i,
            ];

            for (let pass = 0; pass < 4; pass += 1) {
              let clicked = false;
              const bodyText = await page.locator('body').innerText({ timeout: 3000 }).catch(() => '');

              if (textTriggers.some((pattern) => pattern.test(bodyText))) {
                clicked = (await closeVisibleOverlay(page, `${pageTarget.name} triggered overlay`)) || clicked;
                if (clicked) {
                  issues.push(issueRecord(pageTarget, device, 'dismissed-popup', `Closed visible overlay on ${pageTarget.name}.`));
                }
              }

              for (const text of buttonTexts) {
                const exact = new RegExp(`^\\s*${text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s*$`, 'i');
                clicked = (await clickFirstVisible(page, page.getByRole('button', { name: exact }), `button:${text}`)) || clicked;
                clicked = (await clickFirstVisible(page, page.getByRole('link', { name: exact }), `link:${text}`)) || clicked;
              }

              if (!clicked) break;
              await page.waitForLoadState('networkidle', { timeout: 5000 }).catch(() => {});
              await sleep(500);
            }
          }

          async function waitForImagesAndFonts(page) {
            await page.evaluate(async () => {
              const timeout = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
              if (document.fonts && document.fonts.ready) {
                await Promise.race([document.fonts.ready, timeout(5000)]);
              }

              const images = Array.from(document.images || []);
              await Promise.race([
                Promise.all(images.map((image) => {
                  if (image.complete) return Promise.resolve();
                  return new Promise((resolve) => {
                    image.addEventListener('load', resolve, { once: true });
                    image.addEventListener('error', resolve, { once: true });
                  });
                })),
                timeout(12000),
              ]);
            }).catch(() => {});
          }

          async function waitForStableLayout(page) {
            let previous = null;
            let stableCount = 0;
            for (let attempt = 0; attempt < 10; attempt += 1) {
              const snapshot = await page.evaluate(() => ({
                scrollWidth: document.documentElement.scrollWidth,
                scrollHeight: document.documentElement.scrollHeight,
                bodyTextLength: document.body ? document.body.innerText.length : 0,
                imageCount: document.images ? document.images.length : 0,
                completeImageCount: document.images ? Array.from(document.images).filter((image) => image.complete).length : 0,
                busyCount: document.querySelectorAll('[aria-busy="true"], [data-loading="true"], .loading, .spinner, .skeleton').length,
              })).catch(() => null);

              if (previous && snapshot && JSON.stringify(snapshot) === JSON.stringify(previous) && snapshot.busyCount === 0) {
                stableCount += 1;
              } else {
                stableCount = 0;
              }

              previous = snapshot;
              if (stableCount >= 2) return snapshot;
              await sleep(1000);
            }
            return previous;
          }

          async function autoScroll(page) {
            await page.evaluate(async () => {
              document.documentElement.style.scrollBehavior = 'auto';
              document.body.style.scrollBehavior = 'auto';
              await new Promise((resolve) => {
                let lastScrollY = -1;
                const distance = Math.max(700, Math.floor(window.innerHeight * 0.8));
                const timer = setInterval(() => {
                  const maxScrollY = document.documentElement.scrollHeight - window.innerHeight;
                  window.scrollBy(0, distance);
                  if (window.scrollY === lastScrollY || window.scrollY >= maxScrollY) {
                    clearInterval(timer);
                    resolve();
                    return;
                  }
                  lastScrollY = window.scrollY;
                }, 175);
              });
            }).catch(() => {});
            await page.waitForLoadState('networkidle', { timeout: 15000 }).catch(() => {});
            await waitForImagesAndFonts(page);
            await sleep(1200);
          }

          async function stabilizePage(page) {
            await page.addStyleTag({
              content: `
                *, *::before, *::after {
                  animation-delay: -1ms !important;
                  animation-duration: 1ms !important;
                  animation-iteration-count: 1 !important;
                  caret-color: transparent !important;
                  transition-delay: 0s !important;
                  transition-duration: 0s !important;
                }
                html, body { scroll-behavior: auto !important; }
              `,
            }).catch(() => {});

            await page.evaluate(() => {
              document.documentElement.style.scrollBehavior = 'auto';
              document.body.style.scrollBehavior = 'auto';
              if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
              window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
            }).catch(() => {});

            await page.waitForFunction(() => window.scrollY === 0 && window.scrollX === 0, null, { timeout: 10000 }).catch(() => {});
            await waitForImagesAndFonts(page);
            await waitForStableLayout(page);
            await sleep(750);
          }

          async function detectVerificationState(page) {
            return await page.evaluate(() => {
              const title = document.title || '';
              const url = location.href || '';
              const text = document.body ? document.body.innerText.slice(0, 6000) : '';
              const selectors = [
                'iframe[src*="recaptcha" i]',
                'iframe[src*="hcaptcha" i]',
                'iframe[src*="captcha" i]',
                '[class*="captcha" i]',
                '[id*="captcha" i]',
              ];
              const selectorMatch = selectors.find((selector) => document.querySelector(selector));
              const patternMatch = [/captcha/i, /not\s+a\s+robot/i, /are\s+you\s+a\s+human/i, /verify/i, /access\s+denied/i].find((pattern) => pattern.test(`${title}\n${url}\n${text}`));
              return {
                detected: Boolean(selectorMatch || patternMatch),
                selectorMatch: selectorMatch || null,
                patternMatch: patternMatch ? String(patternMatch) : null,
                title,
                url,
                textSample: text.slice(0, 800),
              };
            }).catch((error) => ({ detected: false, error: error instanceof Error ? error.message : String(error) }));
          }

          async function navigateToPage(page, pageTarget) {
            page.setDefaultTimeout(45000);
            page.setDefaultNavigationTimeout(120000);
            let response = null;
            try {
              response = await page.goto(pageTarget.url, { waitUntil: 'commit', timeout: 120000 });
            } catch (error) {
              console.error(`Initial navigation timeout/error for ${pageTarget.name}: ${error instanceof Error ? error.message : String(error)}`);
              response = await page.goto(pageTarget.url, { waitUntil: 'domcontentloaded', timeout: 45000 }).catch(() => null);
            }
            await page.waitForLoadState('domcontentloaded', { timeout: 45000 }).catch(() => {});
            await page.waitForLoadState('load', { timeout: 60000 }).catch(() => {});
            await page.waitForLoadState('networkidle', { timeout: 45000 }).catch(() => {});
            await page.locator('body').waitFor({ state: 'attached', timeout: 45000 }).catch(() => {});
            await sleep(1500);
            return response;
          }

          async function prepareForScreenshot(page, pageTarget, device) {
            await dismissPopups(page, pageTarget, device);
            await waitForImagesAndFonts(page);
            await waitForStableLayout(page);
            await autoScroll(page);
            await dismissPopups(page, pageTarget, device);
            await stabilizePage(page);
            await dismissPopups(page, pageTarget, device);

            const verification = await detectVerificationState(page);
            if (verification.detected) {
              const record = issueRecord(pageTarget, device, 'verification-detected', 'Verification or access-control indicators remained visible. Screenshot will still be captured.', { verification });
              issues.push(record);
              return [record];
            }
            return [];
          }

          async function captureBestEffortScreenshot(page, outputPath) {
            await page.screenshot({ path: outputPath, fullPage: true, animations: 'disabled' }).catch(async () => {
              await page.screenshot({ path: outputPath, fullPage: false, animations: 'disabled' });
            });
          }

          async function capturePageDevice(browser, pageTarget, device) {
            const pageDir = path.join(outputDir, pageTarget.slug);
            fs.mkdirSync(pageDir, { recursive: true });
            const outputPath = path.join(pageDir, `${pageTarget.slug}-${device.fileSuffix}.png`);
            const context = await browser.newContext({
              viewport: device.viewport,
              deviceScaleFactor: device.deviceScaleFactor,
              isMobile: device.isMobile,
              hasTouch: device.hasTouch,
              userAgent: device.userAgent,
              locale: pageTarget.locale,
              timezoneId: pageTarget.timezoneId,
              geolocation: pageTarget.geolocation,
              permissions: ['geolocation'],
              extraHTTPHeaders: { 'Accept-Language': pageTarget.acceptLanguage },
            });

            const page = await context.newPage();
            let response = null;
            let finalUrl = pageTarget.url;
            let captureIssues = [];

            try {
              response = await navigateToPage(page, pageTarget);
              captureIssues = await prepareForScreenshot(page, pageTarget, device);
              await captureBestEffortScreenshot(page, outputPath);
              finalUrl = page.url();

              const record = {
                site: pageTarget.name,
                requestedUrl: pageTarget.url,
                finalUrl,
                device: device.name,
                viewport: device.viewport,
                deviceScaleFactor: device.deviceScaleFactor,
                locale: pageTarget.locale,
                timezoneId: pageTarget.timezoneId,
                outputPath,
                httpStatus: response ? response.status() : null,
                title: await page.title().catch(() => ''),
                documentSize: await page.evaluate(() => ({
                  width: document.documentElement.scrollWidth,
                  height: document.documentElement.scrollHeight,
                  scrollY: window.scrollY,
                  imageCount: document.images ? document.images.length : 0,
                  completeImageCount: document.images ? Array.from(document.images).filter((image) => image.complete).length : 0,
                })).catch(() => null),
                issues: captureIssues,
              };
              manifest.captures.push(record);
              console.log(`Captured ${pageTarget.name} / ${device.name}: ${outputPath}`);
              console.log(JSON.stringify(record, null, 2));
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              finalUrl = page.url ? page.url() : finalUrl;
              const failure = issueRecord(pageTarget, device, 'capture-error', message, { finalUrl, outputPath });
              failures.push(failure);
              issues.push(failure);

              try {
                await captureBestEffortScreenshot(page, outputPath);
                failure.screenshotCaptured = true;
              } catch (screenshotError) {
                failure.screenshotCaptured = false;
                failure.screenshotError = screenshotError instanceof Error ? screenshotError.message : String(screenshotError);
              }

              manifest.captures.push({
                site: pageTarget.name,
                requestedUrl: pageTarget.url,
                finalUrl,
                device: device.name,
                outputPath,
                failed: true,
                screenshotCaptured: failure.screenshotCaptured,
                message,
              });
              console.error(`Capture issue for ${pageTarget.name} / ${device.name}: ${message}`);
            } finally {
              await context.close();
            }
          }

          (async () => {
            fs.mkdirSync(outputDir, { recursive: true });
            const browser = await chromium.launch({ args: ['--disable-dev-shm-usage', '--font-render-hinting=none'] });
            for (const pageTarget of pages) {
              for (const device of devices) {
                await capturePageDevice(browser, pageTarget, device);
              }
            }
            await browser.close();

            fs.writeFileSync(path.join(outputDir, 'capture-manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`);
            fs.writeFileSync(path.join(outputDir, 'capture-issues.json'), `${JSON.stringify(issues, null, 2)}\n`);
            fs.writeFileSync(path.join(outputDir, 'capture-failures.json'), `${JSON.stringify(failures, null, 2)}\n`);

            if (issues.length > 0) {
              console.warn(`${issues.length} screenshot issue(s) recorded. Screenshots were still captured when a page rendered. See capture-issues.json.`);
            } else {
              console.log('All property listing screenshot captures completed without recorded issues.');
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit screenshots to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/property-listing-screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "Capture property listing screenshots"
            git pull --rebase --autostash
            git push
          fi

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: property-listing-screenshots
          path: assets/property-listing-screenshots
          if-no-files-found: error

      - name: Report screenshot capture issues
        run: |
          node <<'NODE'
          const fs = require('fs');
          const issuesPath = 'assets/property-listing-screenshots/capture-issues.json';
          if (!fs.existsSync(issuesPath)) {
            console.log('No capture issues file found.');
            process.exit(0);
          }

          const issues = JSON.parse(fs.readFileSync(issuesPath, 'utf8'));
          if (issues.length === 0) {
            console.log('All property listing screenshot captures completed without recorded issues.');
            process.exit(0);
          }

          console.warn(`${issues.length} screenshot issue(s) recorded, but the workflow remains successful by design:`);
          for (const issue of issues) {
            console.warn(`- ${issue.site} / ${issue.device || 'n/a'} / ${issue.type}: ${issue.message}`);
          }
          NODE
